# Auto-deploy the static site to Vercel on push to main.
#
# Needs one secret: VERCEL_TOKEN (Vercel -> Account Settings -> Tokens).
# Org and project ids are not secret and live in the env block below.
#
# There is no build step: the site is hand-written HTML with inline CSS/JS,
# so the only check worth running is that every page actually parses and the
# internal links point at files that exist.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_5m5zCDqazLonj0sbUBItRASY
  VERCEL_PROJECT_ID: prj_B67Lzv2df36CG37xlb2d62rhbsll

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every page parses and local links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          from html.parser import HTMLParser

          class Parse(HTMLParser):
              def __init__(self): super().__init__(); self.links = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  for key in ('href', 'src'):
                      if d.get(key): self.links.append(d[key])

          failures = []
          pages = sorted(pathlib.Path('.').glob('*.html'))
          if not pages: failures.append('no HTML pages found')

          for page in pages:
              parser = Parse()
              parser.feed(page.read_text(encoding='utf-8', errors='replace'))
              for link in parser.links:
                  if link.startswith(('http://', 'https://', '#', 'data:', 'mailto:')): continue
                  target = link.split('?')[0].split('#')[0].lstrip('/')
                  if not target: continue
                  # cleanUrls: /foo may be served by foo.html
                  if pathlib.Path(target).exists() or pathlib.Path(target + '.html').exists(): continue
                  failures.append(f'{page.name}: broken local link -> {link}')
              print(f'{page.name}: ok ({len(parser.links)} links)')

          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('all pages parse, all local links resolve')
          PY

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set -- skipping deploy."
            echo "Add it at: Settings -> Secrets and variables -> Actions"
            exit 0
          fi
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prod --token="$VERCEL_TOKEN"
